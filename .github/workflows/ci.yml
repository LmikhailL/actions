name: CI

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Clone the project
        uses: actions/checkout@v4

      - name: Install JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'
          cache: maven

      - name: Download dependencies
        run: mvn -B dependency:go-offline

      - name: Build the project
        run: mvn -B compile

      - name: Run unit tests
        run: mvn -B test
